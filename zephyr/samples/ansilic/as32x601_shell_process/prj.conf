# Shell configuration
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="shell> "
CONFIG_SHELL_CMD_BUFF_SIZE=4096
CONFIG_SHELL_PRINTF_BUFF_SIZE=256

# Process support
CONFIG_MAX_PROCESS_COUNT=32
CONFIG_MAX_FD_PER_PROCESS=16

# Memory configuration
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SHELL_STACK_SIZE=2048

# Thread configuration
CONFIG_NUM_PREEMPT_PRIORITIES=15

# Logging (disable to avoid conflicts with shell)
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

# System configuration
CONFIG_CONSOLE=y
CONFIG_CONSOLE_GETCHAR=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_AS32X601=y
CONFIG_PRINTK=y

# Dynamic memory
CONFIG_DYNAMIC_THREAD=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
