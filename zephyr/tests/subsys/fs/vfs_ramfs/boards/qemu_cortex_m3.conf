# qemu_cortex_m3 board-specific configuration for VFS RAMFS test
# The AS32X601 (RISC-V) UART driver defaults to "y" whenever SERIAL is set and
# pulls in PINCTRL, which requires a SoC-provided pinctrl_soc.h that the
# lm3s6965 SoC does not provide. Disable it for this ARM Cortex-M3 build.
CONFIG_UART_AS32X601=n
